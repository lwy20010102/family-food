<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>FamilyFood 连接失败</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8faf8;
        color: #1c1917;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        place-items: center;
      }

      main {
        width: min(100%, 360px);
        padding: 28px 24px;
        border: 1px solid #d9e3da;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgb(28 70 39 / 9%);
        text-align: center;
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        place-items: center;
        border-radius: 16px;
        background: #dcfce7;
        color: #15803d;
        font-size: 28px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p {
        margin: 12px 0 0;
        color: #57534e;
        font-size: 15px;
        line-height: 1.65;
      }

      button,
      a {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 13px 16px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
      }

      button {
        border: 0;
        background: #15803d;
        color: #ffffff;
      }

      a {
        margin-top: 10px;
        border: 1px solid #bbf7d0;
        color: #166534;
      }

      #detail {
        margin-top: 18px;
        color: #78716c;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">餐</div>
      <h1>暂时无法打开 FamilyFood</h1>
      <p>手机当前无法连接到网页服务，请检查网络后重试。</p>
      <button type="button" onclick="retry()">重新连接</button>
      <a href="https://family-food-lwy20010102.vercel.app/">在浏览器中打开</a>
      <div id="detail"></div>
    </main>
    <script>
      const appUrl = "https://family-food-lwy20010102.vercel.app/";
      document.getElementById("detail").textContent = navigator.onLine
        ? "网络已连接，但网页服务暂时没有响应。"
        : "当前设备似乎处于离线状态。";

      function retry() {
        window.location.replace(appUrl + "?retry=" + Date.now());
      }
    </script>
  </body>
</html>
