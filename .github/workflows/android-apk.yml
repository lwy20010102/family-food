name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/android/**"
      - "frontend/capacitor-web/**"
      - "frontend/capacitor.config.ts"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Sync Android project
        working-directory: frontend
        run: pnpm run android:sync

      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Read app version
        id: app_version
        working-directory: frontend/android
        shell: bash
        run: |
          version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building FamilyFood version $version"

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Rename APK with version
        working-directory: frontend/android
        run: mv "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/FamilyFood-v${{ steps.app_version.outputs.version }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyFood-android-v${{ steps.app_version.outputs.version }}
          path: frontend/android/app/build/outputs/apk/debug/FamilyFood-v${{ steps.app_version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30
