services:
  db:
    image: postgres:18.6-alpine
    container_name: family-food-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_food
      POSTGRES_USER: family_food
      POSTGRES_PASSWORD: family_food
    ports:
      - "5432:5432"
    volumes:
      - family_food_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_food -d family_food"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  family_food_pgdata:

